bio: |

  Paolo Giorgini is a Full Professor at the Department of Information Engineering and Computer Science (DISI) of the University of Trento, where he heads the International PhD School on ICT and previously directed the Bachelor and Master degree programmes in Computer Science. He received his PhD in Information Engineering from the University of Ancona in 1998, and was a visiting researcher at the University of Toronto (2000) and the University of Technology Sydney (2005).

  He leads the Software Engineering, Formal Methods and Security group. His contributions include the development of (security) requirements modelling languages and agent- and goal-oriented techniques for software analysis and development. He has published more than 260 refereed journal and conference papers, founded the International Journal of Agent-Oriented Software Engineering, and received the 10-year Most Influential Paper Award at the IEEE International Requirements Engineering Conference (2015).
