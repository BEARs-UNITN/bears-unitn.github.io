bio: |
  Multimodal generative modeling of disease progression from irregular longitudinal data for personalized medicine.

  Letizia Girardi is a PhD student in Information Engineering and Computer Science at the University of Trento, Italy, where she previously obtained her B.Sc. and M.Sc. degrees in Computer Science in 2022 and 2025, respectively. Her research interests lie at the intersection of artificial intelligence and healthcare, with a particular focus on multimodal learning, generative AI, and personalized medicine. Her current research explores generative approaches for modeling disease progression from irregular longitudinal data, integrating heterogeneous sources of information such as medical imaging, clinical records, and biological biomarkers. She is particularly interested in addressing the challenges of incomplete multimodal data, including missing modalities and irregular observations, to develop robust and reliable learning methods for personalized healthcare.
